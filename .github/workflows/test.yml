name: Test

on:
  workflow_call:
    inputs:
      compose:
        description: >
          Run "docker compose up --wait" in the checkout before the tests, so whatever compose
          file the caller has at the repository root (compose.yaml, docker-compose.yml and
          their variants, found by compose's own resolution) provides what a service container
          cannot: several containers, depends_on gated on healthchecks, a build from a git URL.
          The job fails if a service never becomes running, or healthy when it has a
          healthcheck, or if that takes more than five minutes. The stack starts before
          secret-env is exported, so the compose file sees no secrets. Published ports must not
          collide with the host ports the postgres and s3 service containers publish. Compose
          state and logs are printed when the job fails.
        type: boolean
        default: false
      playwright:
        description: >
          Install Chromium and its system packages for playwright-go before the tests. The
          playwright CLI is run from the caller's go.mod, so the driver matches the module
          version. Requires github.com/mxschmitt/playwright-go v0.6100.0 or newer: older
          releases, under the module path github.com/playwright-community/playwright-go,
          download their driver from a CDN that no longer serves it. The browser is downloaded
          on every run, not cached.
        type: boolean
        default: false
      postgres:
        description: >
          Start a PostgreSQL 18 service container, reachable at
          "postgres://test:test@localhost:5433/postgres", with superuser "test", password "test",
          and the databases "postgres" and "template1". Tests must use those values directly,
          because a called workflow inherits neither the caller's env nor its secrets.
        type: boolean
        default: false
      s3:
        description: >
          Start a versitygw S3 service container, reachable at http://localhost:7072
          with access key "access", secret key "secretsecret", and path-style addressing.
          Tests must use those values directly, because a called workflow inherits neither
          the caller's env nor its secrets.
        type: boolean
        default: false
      secret-env:
        description: >
          Names of secrets, separated by whitespace or newlines, to export under the same
          names into the environment of the steps that follow, which is the test run. The
          caller must pass "secrets: inherit", because a called workflow inherits neither
          the caller's env nor its secrets. A listed name with no secret behind it is left
          unset, with a warning, so a test that skips on a missing key still skips, as it
          does on a pull request from a fork. Nothing but the listed names is exported.
        type: string
        default: ""

# Callers must grant contents: read, and pass secrets: inherit to use secret-env.

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # An empty image means no service container, so this only starts when postgres is true.
        # The comparisons make a caller passing the string "false" turn it off too.
        image: ${{ (inputs.postgres == true || inputs.postgres == 'true') && 'postgres:18' || '' }}
        ports:
          - "5433:5432"
        env:
          # Fixed throwaway credentials for a container that only the job can reach.
          POSTGRES_USER: "test"
          POSTGRES_PASSWORD: "test"
          POSTGRES_DB: "template1"
        # The image declares no HEALTHCHECK, so give it one: the runner then waits for
        # Postgres to accept connections before the first step runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      versitygw:
        # An empty image means no service container, so this only starts when s3 is true.
        # The comparisons make a caller passing the string "false" turn it off too.
        image: ${{ (inputs.s3 == true || inputs.s3 == 'true') && 'versity/versitygw:latest' || '' }}
        ports:
          - "7072:7070"
        env:
          # Fixed throwaway credentials for a container that only the job can reach.
          ROOT_ACCESS_KEY: "access"
          ROOT_SECRET_KEY: "secretsecret"
          VGW_BACKEND: "posix"
          VGW_BACKEND_ARG: "/var/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -tags sqlite_fts5,sqlite_math_functions,sqlite_foreign_keys ./...

      - name: Install Chromium for Playwright
        # The comparisons make a caller passing the string "false" turn it off too.
        if: inputs.playwright == true || inputs.playwright == 'true'
        # go run without @version resolves the CLI to the version in the caller's go.mod.
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Start the compose stack
        id: compose
        # The comparisons make a caller passing the string "false" turn it off too.
        if: inputs.compose == true || inputs.compose == 'true'
        run: |
          docker compose up --wait --wait-timeout 300
          docker compose ps

      - name: Export secrets to the environment
        if: inputs.secret-env != ''
        env:
          NAMES: ${{ inputs.secret-env }}
        run: |
          # The whole secrets context can exceed the 128 KiB cap on a single environment
          # string, so it travels in this script rather than in env: above.
          f="$RUNNER_TEMP/secret-env.json"
          trap 'rm -f "$f"' EXIT
          cat >"$f" <<'SECRETSJSON'
          ${{ toJSON(secrets) }}
          SECRETSJSON
          # A heredoc so a multiline value survives, with an unguessable delimiter so a value
          # containing it cannot close the heredoc early and inject further variables.
          d="ghadelim$(openssl rand -hex 16)"
          # Unquoted to split on whitespace and newlines; set -f so a name cannot be a glob
          # that expands against the checkout and skips the check below.
          set -f
          for n in $NAMES; do
            case "$n" in
              [!A-Za-z_]* | *[!A-Za-z0-9_]*)
                echo "secret-env: \"$n\" is not a valid environment variable name; separate names with spaces or newlines" >&2
                exit 1
                ;;
            esac
            if ! jq -e --arg n "$n" 'has($n)' "$f" >/dev/null; then
              echo "::warning::secret-env: no secret named $n, so it is not exported"
              continue
            fi
            { printf '%s<<%s\n' "$n" "$d"
              jq -r --arg n "$n" '.[$n]' "$f"
              printf '%s\n' "$d"
            } >>"$GITHUB_ENV"
          done

      - name: Test
        run: go test -race -shuffle on -tags sqlite_fts5,sqlite_math_functions,sqlite_foreign_keys ./...

      - name: Show compose state and logs
        # Only when the stack was started, whether or not it came up: a skipped step's outcome
        # is "skipped", a failed "docker compose up" leaves the containers around to inspect.
        if: failure() && steps.compose.outcome != 'skipped'
        run: |
          docker compose ps --all
          docker compose logs
