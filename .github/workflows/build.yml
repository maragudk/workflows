name: Build

on:
  workflow_call:

# Callers must grant contents: read. There is no permissions block here because
# a called workflow can only narrow the caller's grant, never widen it, so
# permissions are the caller's to declare.

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          # Build the workspace, like cd.yml does; the default Git-URL context drops .git.
          context: .
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-amd64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          # Build the workspace, like cd.yml does; the default Git-URL context drops .git.
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
