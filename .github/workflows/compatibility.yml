name: Compatibility

on:
  workflow_call:
    inputs:
      postgres:
        description: >
          Start a PostgreSQL 18 service container, reachable at
          "postgres://test:test@localhost:5433/postgres", with superuser "test", password "test",
          and the databases "postgres" and "template1". Tests must use those values directly,
          because a called workflow inherits neither the caller's env nor its secrets.
        type: boolean
        default: false
      s3:
        description: >
          Start a versitygw S3 service container, reachable at http://localhost:7072
          with access key "access", secret key "secretsecret", and path-style addressing.
          Tests must use those values directly, because a called workflow inherits neither
          the caller's env nor its secrets.
        type: boolean
        default: false
      secret-env:
        description: >
          Names of secrets, separated by whitespace or newlines, to export under the same
          names into the environment of the steps that follow, which is the test run. The
          caller must pass "secrets: inherit", because a called workflow inherits neither
          the caller's env nor its secrets. A listed name with no secret behind it is
          exported as an empty string, with a warning, which is what a pull request from a
          fork sees anyway. Nothing but the listed names is exported at all.
        type: string
        default: ""

# Callers must grant contents: read, and pass secrets: inherit to use secret-env.

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go:
          - { go-version: stable }
          - { go-version-file: go.mod }
        deps:
          - locked
          - latest

    services:
      postgres:
        # An empty image means no service container, so this only starts when postgres is true.
        # The comparisons make a caller passing the string "false" turn it off too.
        image: ${{ (inputs.postgres == true || inputs.postgres == 'true') && 'postgres:18' || '' }}
        ports:
          - "5433:5432"
        env:
          # Fixed throwaway credentials for a container that only the job can reach.
          POSTGRES_USER: "test"
          POSTGRES_PASSWORD: "test"
          POSTGRES_DB: "template1"
        # The image declares no HEALTHCHECK, so give it one: the runner then waits for
        # Postgres to accept connections before the first step runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      versitygw:
        # An empty image means no service container, so this only starts when s3 is true.
        # The comparisons make a caller passing the string "false" turn it off too.
        image: ${{ (inputs.s3 == true || inputs.s3 == 'true') && 'versity/versitygw:latest' || '' }}
        ports:
          - "7072:7070"
        env:
          # Fixed throwaway credentials for a container that only the job can reach.
          ROOT_ACCESS_KEY: "access"
          ROOT_SECRET_KEY: "secretsecret"
          VGW_BACKEND: "posix"
          VGW_BACKEND_ARG: "/var/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go.go-version }}
          go-version-file: ${{ matrix.go.go-version-file }}

      - name: Update to latest deps
        if: matrix.deps == 'latest'
        run: go get -u -t ./...

      - name: Export secrets to the environment
        if: inputs.secret-env != ''
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          NAMES: ${{ inputs.secret-env }}
        run: |
          # A heredoc, so a multiline value survives, with a random delimiter so a value
          # containing it cannot close the heredoc early and inject further variables.
          d="ghadelim$RANDOM$RANDOM"
          for n in $NAMES; do
            case "$n" in
              [!A-Za-z_]* | *[!A-Za-z0-9_]*)
                echo "secret-env: \"$n\" is not a valid environment variable name; separate names with spaces or newlines" >&2
                exit 1
                ;;
            esac
            jq -e --arg n "$n" 'has($n) and .[$n] != ""' <<<"$ALL_SECRETS" >/dev/null ||
              echo "::warning::secret-env: no secret named $n, so it is exported empty"
            { printf '%s<<%s\n' "$n" "$d"
              jq -r --arg n "$n" '.[$n] // ""' <<<"$ALL_SECRETS"
              printf '%s\n' "$d"
            } >>"$GITHUB_ENV"
          done

      - name: Test
        run: go test -race -shuffle on -tags sqlite_fts5,sqlite_math_functions,sqlite_foreign_keys ./...
