name: Security

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version passed to actions/setup-go, for example 'stable' or '1.25.x'."
        type: string
        default: stable

# No permissions block: a called workflow that requests more than the caller's
# effective grant fails validation outright, which would break fork pull requests.
# Permissions are inherited from the caller; see the README for what it must grant.

jobs:
  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true

      - id: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Open security issue
        if: failure() && steps.govulncheck.outcome == 'failure' && github.ref_name == 'main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: govulncheck
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$LABEL" --color B60205 --description "govulncheck found vulnerabilities in CI" || true
          existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open for vulnerabilities, leaving it alone."
            exit 0
          fi
          # The backticks below are Markdown for the issue body, not command substitution.
          # shellcheck disable=SC2016
          printf -v body 'The `Security` workflow failed: %s\n\nRun `go run golang.org/x/vuln/cmd/govulncheck@latest ./...` locally to see the vulnerabilities, then upgrade the affected dependencies.' "$RUN_URL"
          gh issue create --title "govulncheck found vulnerabilities" --label "$LABEL" --body "$body"

      - name: Close security issue
        if: success() && github.ref_name == 'main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: govulncheck
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label "$LABEL" --state open --limit 30 --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --comment "govulncheck is green again: $RUN_URL"
            done
